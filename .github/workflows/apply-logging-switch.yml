        throw new UnsupportedOperationException("getModulePrefs must be provided by the real ConfigManager");
    }

    private static void updateModulePrefs(String module, int user, String scope, String key, Object value) {
        // Placeholder: implement or use existing method
        throw new UnsupportedOperationException("updateModulePrefs must be provided by the real ConfigManager");
    }
}
