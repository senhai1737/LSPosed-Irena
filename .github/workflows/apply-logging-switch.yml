name: Apply logging switch (full)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create logging-switch branch
        run: |
          git switch -c logging-switch

      - name: Backup existing target files
        run: |
          TS=$(date +%s)
          BACKUP_DIR="backups/${TS}"
          mkdir -p "${BACKUP_DIR}"
          FILES=(
            "services/daemon-service/src/main/java/org/lsposed/lspd/util/Utils.java"
            "daemon/src/main/java/org/lsposed/lspd/service/ConfigManager.java"
            "daemon/src/main/java/org/lsposed/lspd/service/LogcatService.java"
            "daemon/src/main/jni/logcat.cpp"
            "app/src/main/res/xml/prefs.xml"
            "app/src/main/java/org/lsposed/manager/ui/fragment/SettingsFragment.java"
            "app/src/main/res/values/strings.xml"
          )
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "$(dirname "${BACKUP_DIR}/${f}")"
              cp -a "$f" "${BACKUP_DIR}/${f}"
              echo "Backed up $f -> ${BACKUP_DIR}/${f}"
            else
              echo "File not present (will be created): $f"
            fi
          done
          git add "${BACKUP_DIR}" || true
          git commit -m "chore: backup files before applying logging switch" || true

      - name: Write/overwrite target files (full modifications)
        run: |
          set -e

          # Utils.java
          mkdir -p services/daemon-service/src/main/java/org/lsposed/lspd/util
          cat > services/daemon-service/src/main/java/org/lsposed/lspd/util/Utils.java <<'EOF'
package org.lsposed.lspd.util;

import android.os.SystemProperties;
import android.text.TextUtils;
import android.util.Log;

import java.time.ZoneId;
import java.time.ZoneOffset;
import java.time.zone.ZoneRulesException;

public class Utils {

    public static final String LOG_TAG = "LSPosed";
    // Master logging switch: true = logging enabled, false = no logging
    public static boolean loggingEnabled = true;

    public static final boolean isMIUI = !TextUtils.isEmpty(SystemProperties.get("ro.miui.ui.version.name"));
    public static final boolean isLENOVO = !TextUtils.isEmpty(SystemProperties.get("ro.lenovo.region"));

    public static void logD(Object msg) {
        if (loggingEnabled) Log.d(LOG_TAG, msg.toString());
    }

    public static void logD(String msg, Throwable throwable) {
        if (loggingEnabled) Log.d(LOG_TAG, msg, throwable);
    }

    public static void logW(String msg) {
        if (loggingEnabled) Log.w(LOG_TAG, msg);
    }

    public static void logW(String msg, Throwable throwable) {
        if (loggingEnabled) Log.w(LOG_TAG, msg, throwable);
    }

    public static void logI(String msg) {
        if (loggingEnabled) Log.i(LOG_TAG, msg);
    }

    public static void logI(String msg, Throwable throwable) {
        if (loggingEnabled) Log.i(LOG_TAG, msg, throwable);
    }

    public static void logE(String msg) {
        if (loggingEnabled) Log.e(LOG_TAG, msg);
    }

    public static void logE(String msg, Throwable throwable) {
        if (loggingEnabled) Log.e(LOG_TAG, msg, throwable);
    }

    public static ZoneId getZoneId() {
        var timezone = SystemProperties.get("persist.sys.timezone", "GMT");
        try {
            return ZoneId.of(timezone);
        } catch (ZoneRulesException e) {
            return ZoneOffset.UTC;
        }
    }
}
EOF

