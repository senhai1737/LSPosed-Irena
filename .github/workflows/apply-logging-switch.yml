package org.lsposed.lspd.service;

import android.util.Log;

/**
 * Partial LogcatService augmentation.
 * Add the following methods into your existing LogcatService implementation.
 * These methods use the same style as startVerbose/stopVerbose (send special log messages that native thread listens for).
 */
public class LogcatService {
    private static final String TAG = "LogcatService";

    public void startVerbose() {
        // existing implementation should be kept; provided here as reference
        Log.i(TAG, "!!start_verbose!!");
    }

    public void stopVerbose() {
        Log.i(TAG, "!!stop_verbose!!");
    }

    public void enableLogging() {
        Log.i(TAG, "!!enable_logging!!");
    }

    public void disableLogging() {
        Log.i(TAG, "!!disable_logging!!");
    }

    public void refresh(boolean isVerboseLog) {
        if (isVerboseLog) {
            Log.i(TAG, "!!refresh_verbose!!");
        } else {
            Log.i(TAG, "!!refresh_modules!!");
        }
    }
}
EOF

          # logcat.cpp (native additions)
          mkdir -p daemon/src/main/jni
          cat > daemon/src/main/jni/logcat.cpp <<'EOF'
/*
 * Partial additions to logcat.cpp
 *
 * Merge the snippets into your existing logcat.cpp:
 *  - add `logging_enabled_` as a class member (or atomic<bool>)
 *  - modify Log(...) to check logging_enabled_
 *  - in ProcessBuffer() when handling LSPosedLogcat tag, respond to "!!enable_logging!!"/"!!disable_logging!!"
 *
 * Below is a self-contained snippet illustrating the additions.
 */

#include <string_view>
#include <string>
#include <atomic>
#include <cstdio>
#include <memory>

class Logcat {
public:
    Logcat() : verbose_(false), logging_enabled_(true) {}

    bool verbose_;
    std::atomic<bool> logging_enabled_;

    std::unique_ptr<FILE, decltype(&fclose)> verbose_file_{nullptr, &fclose};
    std::unique_ptr<FILE, decltype(&fclose)> modules_file_{nullptr, &fclose};

    inline void Log(std::string_view str) {
        if (!logging_enabled_.load(std::memory_order_relaxed)) return;
        if (verbose_) {
            if (verbose_file_) {
                fprintf(verbose_file_.get(), "%.*s", static_cast<int>(str.size()), str.data());
                fflush(verbose_file_.get());
            }
        }
        if (modules_file_) {
            fprintf(modules_file_.get(), "%.*s", static_cast<int>(str.size()), str.data());
            fflush(modules_file_.get());
        }
    }

    void HandleLsposedLogcatMessage(const std::string_view &msg) {
        if (msg == "!!start_verbose!!") {
            verbose_ = true;
        } else if (msg == "!!stop_verbose!!") {
            verbose_ = false;
        } else if (msg == "!!refresh_modules!!") {
            // refresh modules
        } else if (msg == "!!refresh_verbose!!") {
            // refresh verbose
        } else if (msg == "!!enable_logging!!") {
            logging_enabled_.store(true, std::memory_order_relaxed);
        } else if (msg == "!!disable_logging!!") {
            logging_enabled_.store(false, std::memory_order_relaxed);
        } else {
            // normal handling...
        }
    }

    // ...
};
