package org.lsposed.manager.ui.fragment;

import android.content.ActivityNotFoundException;
import android.os.Build;
import android.os.Bundle;

import androidx.appcompat.app.AppCompatDelegate;
import androidx.core.text.HtmlCompat;
import androidx.preference.Preference;
import java.time.LocalDateTime;
import java.util.ArrayList;
import java.util.Locale;

import org.lsposed.manager.App;
import org.lsposed.manager.R;
import org.lsposed.lspd.service.ConfigManager;
import rikka.material.preference.MaterialSwitchPreference;
import rikka.material.preference.SimpleMenuPreference;

/**
 * Partial SettingsFragment - include these additions into your existing fragment implementation.
 * The fragment below focuses on adding handling for the logging master switch and verbose switch.
 */
public class SettingsFragment extends androidx.preference.PreferenceFragmentCompat {

    @Override
    public void onCreatePreferences(Bundle savedInstanceState, String rootKey) {
        addPreferencesFromResource(R.xml.prefs);

        boolean installed = ConfigManager.isBinderAlive();

        // 日志总开关
        MaterialSwitchPreference prefLogging = findPreference("enable_logging");
        if (prefLogging != null) {
            prefLogging.setEnabled(!BuildConfig.DEBUG && installed);
            prefLogging.setChecked(installed && ConfigManager.isLoggingEnabled());
            prefLogging.setOnPreferenceChangeListener((preference, newValue) -> {
                ConfigManager.setLoggingEnabled((boolean) newValue);
                MaterialSwitchPreference prefVerboseLogs = findPreference("disable_verbose_log");
                if (prefVerboseLogs != null) {
                    prefVerboseLogs.setEnabled((boolean) newValue && !BuildConfig.DEBUG && installed);
                }
                return true;
            });
        }

        MaterialSwitchPreference prefVerboseLogs = findPreference("disable_verbose_log");
        if (prefVerboseLogs != null) {
            prefVerboseLogs.setEnabled(!BuildConfig.DEBUG && installed && ConfigManager.isLoggingEnabled());
            prefVerboseLogs.setChecked(!installed || ConfigManager.isVerboseLogEnabled());
            prefVerboseLogs.setOnPreferenceChangeListener((preference, newValue) -> {
                if (!ConfigManager.isLoggingEnabled()) {
                    var parent = getActivity();
                    // showHint is from your parent fragment in original project; if not present, adapt this line.
                    // For safety we just return false here to block change.
                    return false;
                }
                return ConfigManager.setVerboseLogEnabled(!(boolean) newValue);
            });
        }

        // Keep the rest of your existing pref handlers unchanged.
    }
}
