      - name: Commit and push changes
        run: |
          git add -A
          git commit -m "feat: add logging switch" || (echo "No changes to commit" && exit 0)
          git push --set-upstream origin logging-switch

      - name: Create Pull Request (dev <- logging-switch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TITLE="feat: add logging switch"
          BODY="This PR adds a master logging switch and wires it through Java, native, and UI layers.\n\nPlease review and run CI/build before merging."
          # Create PR via GitHub API
          RESPONSE=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/pulls" \
            -d "$(printf '{"title":"%s","head":"%s","base":"%s","body":"%s"}' "$TITLE" "logging-switch" "dev" "$BODY")")
          echo "GitHub API response:"
          echo "$RESPONSE"