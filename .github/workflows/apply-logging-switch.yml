          cat > daemon/src/main/java/org/lsposed/lspd/service/ConfigManager.java <<'EOF'
package org.lsposed.lspd.service;

import android.util.Log;
import org.lsposed.lspd.util.Utils;
import java.util.Map;

/**
 * Partial replacement / augmentation of ConfigManager.
 * Merge these methods into your existing ConfigManager implementation if you already have one.
 *
 * NOTE: This class uses existing helpers assumed to be present in the project:
 * - ServiceManager.getLogcatService()
 * - updateModulePrefs(String module, int user, String scope, String key, Object value)
 * - getModulePrefs(String module, int user, String scope) -> Map<String, Object>
 *
 * Adjust signatures to match your repository.
 */
public class ConfigManager {
    private static final String TAG = "ConfigManager";

    // Persisted logging flag key: "enable_logging"
    public static void setLoggingEnabled(boolean enabled) {
        if (BuildConfig.DEBUG) {
            Log.w(TAG, "Attempt to change logging in DEBUG build ignored.");
            return;
        }

        try {
            var logcatService = ServiceManager.getLogcatService();
            if (logcatService != null) {
                if (enabled) {
                    logcatService.enableLogging();
                } else {
                    logcatService.disableLogging();
                }
            }
        } catch (Throwable t) {
            Log.w(TAG, "Failed to notify LogcatService", t);
        }

        try {
            // Persist setting. Adjust updateModulePrefs signature if your project differs.
            updateModulePrefs("lspd", 0, "config", "enable_logging", enabled);
        } catch (Throwable t) {
            Log.w(TAG, "Failed to persist enable_logging", t);
        }
    }

    public static boolean isLoggingEnabled() {
        try {
            Map<String, Object> prefs = getModulePrefs("lspd", 0, "config");
            if (prefs == null) return true;
            Object v = prefs.get("enable_logging");
            return v == null || (boolean) v;
        } catch (Throwable t) {
            Log.w(TAG, "Failed to read enable_logging, defaulting to true", t);
            return true;
        }
    }

